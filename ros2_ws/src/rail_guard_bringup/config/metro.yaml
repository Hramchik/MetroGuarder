# Параметры по умолчанию для метрополитена (колея 1520 мм, тоннель).
# Габарит подвижного состава метро: ширина 2.7 м, высота 3.7 м от УГР;
# добавлен запас на раскачку кузова и погрешность оценки оси пути.

# Формат файла параметров ROS 2: те же имена, что у параметров ноды
# (секция.поле), поэтому файл годится и для load_yaml, и для ros2 param.
/**:
  ros__parameters:
    track:
      gauge: 1.59               # центры головок рельсов при колее 1520 мм
      search_half_width: 2.5    # в тоннеле соседнего пути нет — сужаем поиск
      max_fit_range: 100.0
      smoothing: 0.6
    gauge:
      half_width: 1.40
      lateral_margin: 0.25
      height: 3.75
      bottom: -0.10
      car_length: 19.2
      max_range: 150.0
    ground:
      search_half_width: 2.5
      rail_head_offset: 0.25
    preprocess:
      x_max: 160.0
      y_abs_max: 8.0
    decision:
      default_speed: 22.0       # ~80 км/ч
      service_decel: 0.9
      emergency_decel: 1.3
      reaction_time: 0.6
    objects:
      overhead_clearance: 2.6   # свод тоннеля и кабельные консоли выше этой высоты
