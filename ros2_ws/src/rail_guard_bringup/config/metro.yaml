# Профиль линии метрополитена.
#
# Здесь только то, что нельзя измерить по облаку точек: габарит подвижного
# состава, геометрия пути и тормозные характеристики. Всё остальное —
# плотность лучей датчика, его дальнобойность, тип сечения, длина коридора,
# пороги числа точек — система измеряет и выводит сама (lib/sensor_model.py,
# lib/scene.py, lib/derive.py). Прежде в этом файле стояло полсотни настроек,
# и половина из них была подобрана по конкретным записям: на другом лидаре
# или другом участке они означали уже не то, ради чего их ставили.
#
# Формат файла параметров ROS 2: те же имена, что у параметров ноды
# (секция.поле), поэтому файл годится и для load_yaml, и для ros2 param.
/**:
  ros__parameters:
    sensor:
      # Ориентация датчика определяется по первому пригодному кадру. При
      # известной установке лучше задать явно (x, -x, y, -y, z, -z): это
      # исключает любую неоднозначность на кадрах с пустым тоннелем.
      forward_axis: auto
      up_axis: auto

    track:
      gauge: 1.59        # центры головок рельсов при колее 1520 мм
      spacing: 4.0       # междупутье на перегоне
      min_radius: 150.0  # минимальный радиус кривой на линии

    gauge:
      # Габарит подвижного состава метро: ширина 2.7 м, высота 3.7 м от УГР.
      half_width: 1.40
      lateral_margin: 0.25   # запас на раскачку кузова и погрешность оси пути
      height: 3.75
      # Нижняя кромка кузова и подвагонного оборудования над УГР. Предмет
      # ниже неё поезд проходит без контакта, а путевое оборудование —
      # контррельсы, остряки стрелок, накладки, лотки — лежит как раз там.
      # Занижать нельзя: граница в 5 см над УГР ловит элементы стрелочного
      # перевода и даёт команду торможения на исправном пути.
      bottom: 0.10
      car_length: 19.2

    decision:
      default_speed: 22.0    # эксплуатационная скорость линии, ~80 км/ч
      service_decel: 0.9
      emergency_decel: 1.3
      reaction_time: 0.6     # задержка тракта принятия решения

    safety:
      # Наименьшее препятствие, которое система обязана видеть. Отсюда
      # выводятся все пороги числа точек и предельная дальность обнаружения.
      min_target_width: 0.30
      min_target_height: 0.50
      min_target_depth: 0.30
