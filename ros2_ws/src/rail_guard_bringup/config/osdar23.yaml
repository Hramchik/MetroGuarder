# Параметры под датасет OSDaR23 (магистральная железная дорога Германии).
# Отличия от метро: колея 1435 мм, габарит подвижного состава шире,
# лидары дальнобойные (Livox Tele-15 до 300+ м), рядом до трёх соседних путей.

# Формат файла параметров ROS 2: те же имена, что у параметров ноды
# (секция.поле), поэтому файл годится и для load_yaml, и для ros2 param.
/**:
  ros__parameters:
    track:
      gauge: 1.505              # центры головок рельсов при колее 1435 мм
      search_half_width: 4.0    # соседний путь в 4.5 м — дальше уходить нельзя
      smoothing: 0.75           # кривая R=250 при 10 Гц: оценке нужно успевать
      max_fit_range: 120.0
    gauge:
      half_width: 1.60          # ширина кузова магистрального вагона ~3.1 м
      lateral_margin: 0.25
      height: 4.30              # верхняя граница выше: контактная сеть вне габарита
      bottom: -0.10
      car_length: 26.4
      max_range: 200.0
    decision:
      default_speed: 15.0
    preprocess:
      x_max: 250.0
