# Профиль магистральной железной дороги (колея 1435 мм, записи OSDaR23).
#
# Отличается от метро только физикой: колея, габарит подвижного состава,
# междупутье, тормозные характеристики. Ни одного параметра обработки здесь
# нет — тип сечения (открытый перегон или тоннель), дальность коридора,
# пороги детекции система определяет по самим кадрам. Именно поэтому профиль
# и оказался таким коротким: разница между метро и магистралью — это разница
# в поезде и пути, а не в настройках алгоритма.
/**:
  ros__parameters:
    track:
      gauge: 1.505       # центры головок рельсов при колее 1435 мм
      spacing: 4.5       # междупутье на магистральной линии
      min_radius: 250.0  # минимальный радиус кривой на участке

    gauge:
      half_width: 1.60   # ширина кузова магистрального вагона ~3.1 м
      lateral_margin: 0.25
      height: 4.30       # верх габарита: контактная сеть остаётся выше
      # Нижняя кромка кузова над УГР: по ГОСТ 9238 нижние части подвижного
      # состава не опускаются ниже 100-125 мм. Ниже этой отметки лежит
      # путевое оборудование, по которому поезд ездит, — остряки стрелок,
      # контррельсы, накладки; граница в 5 см над УГР принимает их за
      # препятствие и тормозит на исправном пути.
      bottom: 0.125
      car_length: 26.4

    decision:
      default_speed: 15.0
      service_decel: 0.9
      emergency_decel: 1.3
      reaction_time: 0.6

    safety:
      min_target_width: 0.30
      min_target_height: 0.50
      min_target_depth: 0.30
